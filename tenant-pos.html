function posInfo(no){no=String(no||"").trim().toUpperCase();let m;

const mv=(patch.moves||[]).filter(m=>D.registers[m.id]&&D.tenants[m.tenantId]),dl=(patch.deletes||[]).filter(id=>D.registers[id]),tgt={};mv.forEach(m=>tgt[m.id]=m.tenantId);const ed=Object.values(D.edc).filter(e=>tgt[e.registerNo]),de=(patch.deleteEdc||[]).filter(id=>D.edc[id]);
try{const b=db.batch();mv.forEach(m=>b.set(db.collection(C.registers).doc(m.id),{tenantId:m.tenantId,note:m.note||"",status:"使用中",updatedAt:ts(),updatedBy:"歸屬調整："+by},{merge:true}));dl.forEach(id=>b.delete(db.collection(C.registers).doc(id)));ed.forEach(e=>b.set(db.collection(C.edc).doc(e.id),{tenantId:tgt[e.registerNo],updatedAt:ts(),updatedBy:"歸屬調整："+by},{merge:true}));de.forEach(id=>b.delete(db.collection(C.edc).doc(id)));await b.commit();
await db.collection(C.log).add({at:ts(),by,col:"batch",id:"mpos-assign",act:"assign",before:null,after:{moved:mv.map(m=>m.id),deleted:dl,edcMoved:ed.length,edcDeleted:de}});
mv.forEach(m=>D.registers[m.id]={...D.registers[m.id],tenantId:m.tenantId,note:m.note||"",status:"使用中"});dl.forEach(id=>delete D.registers[id]);ed.forEach(e=>D.edc[e.id]={...e,tenantId:tgt[e.registerNo]});de.forEach(id=>delete D.edc[id]);
for(const t of new Set(mv.map(m=>m.tenantId)))await syncFloor(t);
render();fillFl();$("#log").textContent+=`\n完成：改掛 ${mv.length} 台（含 ${ed.length} 台 EDC）、刪除 ${dl.length} 筆機器、${de.length} 筆 EDC`+(mv.length<(patch.moves||[]).length||dl.length<(patch.deletes||[]).length?"（部分項目在資料庫找不到，已略過）":"")}catch(e){$("#log").textContent+="\n失敗："+e.message}};
// ---------- import
$("#fi").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{seed=JSON.parse(await f.text())}catch(x){$("#log").textContent="不是有效的 JSON";return}
$("#log").textContent=Object.keys(seed).map(k=>`${k}：${seed[k].length} 筆`).join("\n");$("#go").disabled=false};
$("#go").onclick=async()=>{const by=$("#op").value;if(!by){alert("請先選擇操作人");return}if(!confirm("確定匯入？相同 ID 的資料會被覆蓋。"))return;$("#go").disabled=true;seedFix();
const map={tenants:"tenants",registers:"registers",edc:"edc",events:"events",notes:"notes"},lg=t=>{$("#log").textContent+="\n"+t};
try{for(const k of Object.keys(map)){const a=seed[k]||[];for(let i=0;i<a.length;i+=400){const b=db.batch();a.slice(i,i+400).forEach(x=>{const{id,...d}=x;b.set(db.collection(C[k]).doc(id),{...d,createdAt:ts(),updatedAt:ts(),updatedBy:"匯入："+by})});await b.commit();lg(`${k}：${Math.min(i+400,a.length)}/${a.length}`)}}
lg("完成，重新載入資料…");await boot();lg("已載入")}catch(e){lg("失敗："+e.message)}$("#go").disabled=false};
</script></body></html>
