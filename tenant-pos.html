<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>租戶 POS 資料維護</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:14px "Microsoft JhengHei",sans-serif;color:#1f2937;background:#f3f4f6}
header{background:#1f3864;color:#fff;padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0 8px 0 0}nav button{background:none;border:0;color:#cbd5e1;padding:6px 12px;cursor:pointer;font:inherit;border-bottom:2px solid transparent}
nav button.on{color:#fff;border-color:#fff}.sp{flex:1}header select{padding:3px}
main{padding:12px 16px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
input,select,textarea,button{font:inherit}input,select,textarea{padding:4px 6px;border:1px solid #cbd5e1;border-radius:4px;background:#fff}
button.p{background:#1f3864;color:#fff;border:0;border-radius:4px;padding:5px 12px;cursor:pointer}button.s{background:#fff;border:1px solid #94a3b8;border-radius:4px;padding:3px 8px;cursor:pointer}button.d{color:#b91c1c}
table{border-collapse:collapse;width:100%;background:#fff}th{background:#e5e7eb;text-align:left;position:sticky;top:0}td,th{border:1px solid #d1d5db;padding:4px 6px;vertical-align:top}
#tb tr{cursor:pointer}#tb tr:hover{background:#eff6ff}.bad{color:#b91c1c;font-weight:bold}.warn{color:#b45309;font-weight:bold}
.b{background:#fee2e2;color:#991b1b;border-radius:3px;padding:0 4px;font-size:12px;margin-left:4px}.t{background:#dbeafe;color:#1e40af;border-radius:3px;padding:0 4px;font-size:12px}
#login{position:fixed;inset:0;background:#1f3864;display:flex;align-items:center;justify-content:center;z-index:9}#login div{background:#fff;padding:24px;border-radius:8px;display:grid;gap:8px;width:280px}
#mod{position:fixed;inset:0;background:#0007;display:none;overflow:auto;z-index:5}#mod>div{background:#f9fafb;margin:24px auto;max-width:1100px;border-radius:8px;padding:16px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}.g label{display:grid;gap:2px;font-size:12px;color:#475569}
h3{margin:16px 0 6px;font-size:15px}td input,td select{width:100%}.res{background:#fff;border:1px solid #d1d5db;margin:4px 0;padding:6px 10px;cursor:pointer}.res:hover{background:#eff6ff}
#msg{color:#475569;margin-left:8px}pre{background:#fff;padding:8px;max-height:240px;overflow:auto}
#tw{overflow-x:auto}#tt{table-layout:fixed;width:auto}#tt td,#tt th{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rz{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize;touch-action:none}.rz:hover,.rz.on{background:#1f3864}
#tt td.nt{white-space:normal;overflow:visible;text-overflow:clip}#tt td.nt div{margin:2px 0}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head><body>
<div id="login"><div><b>租戶 POS 資料維護</b><input id="pw" type="password" placeholder="共用密碼"><button class="p" id="lb">登入</button><span id="err" class="bad"></span></div></div>
<header><h1>租戶 POS 資料維護</h1>
<nav><button data-v="tenants" class="on">專櫃</button><button data-v="search">查詢</button><button data-v="import">匯入</button></nav>
<span class="sp"></span>操作人 <select id="op"></select><button class="s" id="addop">＋</button><span id="msg"></span></header>
<main>
<section id="v-tenants"><div class="bar"><input id="q" placeholder="櫃號／櫃名／分機"><select id="fl"></select>
<select id="st"><option value="">全部狀態</option><option>營業中</option><option>籌備中（新開幕）</option><option>已撤櫃</option><option>虛擬</option></select>
<select id="cf"><option value="">全部合約</option><option>已到期</option><option>90日內</option><option>有效</option><option>無資料</option></select>
<button class="p" id="nt">＋新增專櫃</button><b id="cnt"></b></div>
<div id="tw"><table id="tt"><colgroup id="cg"></colgroup><thead><tr><th>櫃號</th><th>櫃名</th><th>類型</th><th>樓層</th><th>位置</th><th>分機</th><th>合約到期</th><th>狀態</th><th>機器</th><th>EDC</th><th>備註</th></tr></thead><tbody id="tb"></tbody></table></div></section>

<div class="bar"><input type="file" id="fi" accept=".json"><button class="p" id="go" disabled>開始匯入</button></div><pre id="log">尚未選擇檔案</pre><hr><p>已匯入的資料：依機號重新計算「樓層」與「位置號碼」並寫入資料庫（只更新有變動的資料）。</p><button class="p" id="rc">依機號重算樓層與位置</button></section>
</main>
<div id="mod"><div id="md"></div></div>
<script>
const FB={apiKey:"AIzaSyApAO5NwuoXSJtO3y53taHLPgDxYk32v8E",authDomain:"posteam-tenant.firebaseapp.com",projectId:"posteam-tenant"}; // ← 填入 Firebase 設定
const SHARED_EMAIL="jiajie.lin@tfc101.com.tw"; // ← 共用帳號（Firebase Auth 的 Email/Password 使用者）
firebase.initializeApp(FB);const auth=firebase.auth(),db=firebase.firestore();
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const C={tenants:"tp_tenants",registers:"tp_registers",edc:"tp_edc",notes:"tp_notes",events:"tp_events",log:"tp_log",meta:"tp_meta"};
const D={tenants:{},registers:{},edc:{},notes:{}};let OPS=[],curT=null,seed=null;
const CAT=["","一般","美食","餐廳","觀景台","特店"],TST=["營業中","籌備中（新開幕）","已撤櫃","虛擬"],MOD=["","PP-9635","大黑","mPOS","紀念品POS","人工售票","KIOSK","虛擬"],
RST=["使用中","待安裝","待確認","備機","停用","虛擬（系統）"],NC=["營運規則","設備用途","商代/EDC 特殊","安裝不易","特殊事件","位置","待辦","其他"],
PFX={B1F:"20","1F":"21","2F":"22","3F":"23","4F":"24"},FLO=["B1F","1F","2F","3F","4F","5F","6F","88F","89F","91F","101F"];
const fo=f=>{if(!f)return 999;if(f==="B1F")return 0;const m=/^(\d+)F$/.exec(f);return m?+m[1]:500},msg=t=>$("#msg").textContent=t||"";
const opts=(a,v)=>a.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("");
$("#lb").onclick=()=>auth.signInWithEmailAndPassword(SHARED_EMAIL,$("#pw").value).catch(e=>$("#err").textContent="登入失敗："+e.code);
$("#pw").onkeydown=e=>{if(e.key==="Enter")$("#lb").click()};
auth.onAuthStateChanged(u=>{$("#login").hidden=!!u;if(u)boot()});
async function boot(){msg("載入中…");try{for(const k of Object.keys(D)){D[k]={};(await db.collection(C[k]).get()).forEach(d=>D[k][d.id]={...d.data(),id:d.id})}
const m=await db.collection(C.meta).doc("operators").get();OPS=m.exists?m.data().list:[];}catch(e){msg("載入失敗："+e.message);return}
fillOps();fillFl();render();msg("")}
function fillOps(){const v=localStorage.op||"";$("#op").innerHTML=opts([""].concat(OPS),v)}
$("#op").onchange=e=>localStorage.op=e.target.value;
$("#addop").onclick=async()=>{const n=prompt("新增操作人姓名"),nm=(n||"").trim();if(!nm||OPS.includes(nm))return;try{await db.collection(C.meta).doc("operators").set({list:[...OPS,nm]});OPS.push(nm);localStorage.op=nm;fillOps()}catch(e){alert("新增失敗："+e.message)}};
function fillFl(){const s=new Set(Object.values(D.tenants).map(t=>t.floor).filter(Boolean));$("#fl").innerHTML='<option value="">全部樓層</option>'+opts([...s].sort((a,b)=>fo(a)-fo(b)||a.localeCompare(b)))}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));["tenants","search","import"].forEach(v=>$("#v-"+v).hidden=v!==b.dataset.v)});
const cs=t=>{if(!t.contractEnd)return["無資料",""];const d=(new Date(t.contractEnd)-new Date())/864e5;return d<0?["已到期","bad"]:d<=90?["90日內","warn"]:["有效",""]};
const regsOf=id=>Object.values(D.registers).filter(r=>r.tenantId===id),edcOf=id=>Object.values(D.edc).filter(e=>e.tenantId===id),notesOf=(c,id)=>Object.values(D.notes).filter(n=>n.scope===c&&n.targetId===id);
function posInfo(no){no=String(no||"").trim().toUpperCase();let m;
if(m=/^C([BLMNO])/.exec(no))return{floor:{B:"B1F",L:"1F",M:"2F",N:"3F",O:"4F"}[m[1]],pos:null,temp:true};
if(m=/^T(\d{2})(\d)/.exec(no))return{floor:`${+m[1]}F`,pos:+m[2],temp:false};
if(m=/^B(\d)(\d{2})/.exec(no))return{floor:`B${m[1]}F`,pos:+m[2],temp:false};
if(m=/^[A-Z](\d)(\d{2})/.exec(no))return{floor:`${m[1]}F`,pos:+m[2],temp:false};
return null}
const posLoc=no=>{const i=posInfo(no);return i?(i.temp?"臨時櫃":`${i.pos}號`):""};
const skipV=r=>r.model==="虛擬"||r.status==="虛擬（系統）";
const locFields=r=>{const i=skipV(r)?null:posInfo(r.registerNo);return{floor:i?i.floor:null,posNo:i&&!i.temp?i.pos:null,isTemp:!!(i&&i.temp)}};
function tenantFloor(regs){const ok=regs.filter(r=>!skipV(r)),cnt=a=>{const c={};a.forEach(r=>{const i=posInfo(r.registerNo);if(i)c[i.floor]=(c[i.floor]||0)+1});const e=Object.entries(c).sort((x,y)=>y[1]-x[1]);return e.length?e[0][0]:null};
return cnt(ok.filter(r=>r.model!=="mPOS"))||cnt(ok)}
async function syncFloor(tid){const t=D.tenants[tid];if(!t)return;const f=tenantFloor(regsOf(tid));if(f&&f!==t.floor)await put("tenants",tid,{floor:f})}
function seedFix(){const rs=seed.registers||[],by={};rs.forEach(r=>{Object.assign(r,locFields(r));(by[r.tenantId]=by[r.tenantId]||[]).push(r)});(seed.tenants||[]).forEach(t=>{const f=tenantFloor(by[t.id]||[]);if(f)t.floor=f})}
$("#rc").onclick=async()=>{const by=$("#op").value,lg=t=>{$("#log").textContent+="\n"+t};if(!by){alert("請先選擇操作人");return}
const ups=[];Object.values(D.registers).forEach(r=>{const f=locFields(r);if((r.floor||null)!==f.floor||(r.posNo??null)!==f.posNo||!!r.isTemp!==f.isTemp)ups.push(["registers",r.id,f])});
Object.values(D.tenants).forEach(t=>{const f=tenantFloor(regsOf(t.id));if(f&&f!==t.floor)ups.push(["tenants",t.id,{floor:f}])});
if(!ups.length){lg("沒有需要更新的資料");return}
if(!confirm(`將更新 ${ups.length} 筆（機器的樓層／位置、專櫃樓層），確定？`))return;
try{for(let i=0;i<ups.length;i+=400){const b=db.batch();ups.slice(i,i+400).forEach(([c,id,d])=>b.set(db.collection(C[c]).doc(id),{...d,updatedAt:ts(),updatedBy:"重算："+by},{merge:true}));await b.commit()}
await db.collection(C.log).add({at:ts(),by,col:"batch",id:"recalc",act:"recalc",before:null,after:{count:ups.length,sample:ups.slice(0,30).map(([c,id,d])=>({c,id,...d}))}});
ups.forEach(([c,id,d])=>D[c][id]={...D[c][id],...d});fillFl();render();lg(`完成：更新 ${ups.length} 筆`)}catch(e){lg("失敗："+e.message)}};
const CW0=[80,220,70,100,180,80,150,110,60,60,320];
function cwGet(){try{const a=JSON.parse(localStorage.tp_colw);if(Array.isArray(a)&&a.length===CW0.length-1)a.push(CW0[CW0.length-1]);if(Array.isArray(a)&&a.length===CW0.length)return a}catch(e){}return CW0.slice()}
function cwApply(a){$("#cg").innerHTML=a.map(w=>`<col style="width:${w}px">`).join("");$("#tt").style.width=a.reduce((x,y)=>x+y,0)+"px"}
function cwInit(){const a=cwGet();cwApply(a);document.querySelectorAll("#tt th").forEach((th,i)=>{const h=document.createElement("div");h.className="rz";th.appendChild(h);
h.onpointerdown=e=>{e.preventDefault();h.setPointerCapture(e.pointerId);const x0=e.clientX,w0=a[i];h.classList.add("on");
h.onpointermove=m=>{a[i]=Math.max(40,Math.round(w0+m.clientX-x0));cwApply(a)};
h.onpointerup=()=>{h.onpointermove=h.onpointerup=null;h.classList.remove("on");localStorage.tp_colw=JSON.stringify(a)}};
h.ondblclick=()=>{a[i]=CW0[i];cwApply(a);localStorage.tp_colw=JSON.stringify(a)}})}
cwInit();
function render(){const q=$("#q").value.trim().toLowerCase(),fl=$("#fl").value,st=$("#st").value,cf=$("#cf").value,rc={},ec={},lc={},nm={},etid={},pn={},pm={};
Object.values(D.registers).forEach(r=>{rc[r.tenantId]=(rc[r.tenantId]||0)+1;if(r.model==='虛擬'||r.status==='虛擬（系統）')return;const l=posLoc(r.registerNo);if(l)(lc[r.tenantId]=lc[r.tenantId]||[]).push(l);const i=posInfo(r.registerNo);if(i&&i.floor===(D.tenants[r.tenantId]||{}).floor){const o=r.model==='mPOS'?pm:pn,k=i.temp?9998:i.pos;o[r.tenantId]=Math.min(o[r.tenantId]??99999,k)}});Object.values(D.edc).forEach(e=>ec[e.tenantId]=(ec[e.tenantId]||0)+1);
Object.values(D.edc).forEach(e=>etid[e.tid]=e);
const addn=(t,x)=>{if(t)(nm[t]=nm[t]||[]).push(x)};
Object.values(D.notes).forEach(n=>{let t=null,p="";if(n.scope==="tenant")t=n.targetId;else if(n.scope==="register"){const r=D.registers[n.targetId];t=r&&r.tenantId;p=n.targetId+"："}else if(n.scope==="edc"){const e=etid[n.targetId];t=e&&e.tenantId;p="TID "+n.targetId+"："}
addn(t,`<div>• <span class="t">${esc(n.category)}</span> ${esc(p+n.content)}</div>`)});
Object.values(D.registers).forEach(r=>r.note&&addn(r.tenantId,`<div>• ${esc(r.registerNo)}：${esc(r.note)}</div>`));
const rows=Object.values(D.tenants).filter(t=>(!q||`${t.tenantNo} ${t.name} ${t.phone}`.toLowerCase().includes(q))&&(!fl||t.floor===fl)&&(!st||t.status===st)&&(!cf||cs(t)[0]===cf))
.sort((a,b)=>{const pk=t=>pn[t.id]??pm[t.id]??99999;return fo(a.floor)-fo(b.floor)||pk(a)-pk(b)||String(a.tenantNo||a.id).localeCompare(String(b.tenantNo||b.id))});
$("#tb").innerHTML=rows.map(t=>{const[c,k]=cs(t),L=[...new Set(lc[t.id]||[])].join('、'),NH=(nm[t.id]||[]).join('');return`<tr data-id="${esc(t.id)}"><td>${esc(t.tenantNo)}</td><td title="${esc(t.name)}">${esc(t.name)}</td><td>${esc(t.category)}</td><td>${esc(t.floor)}</td><td title="${esc(L)}">${esc(L)}</td><td>${esc(t.phone)}</td><td class="${k}">${esc(t.contractEnd||"")}${k?" ("+c+")":""}</td><td>${esc(t.status)}</td><td>${rc[t.id]||0}</td><td>${ec[t.id]||0}</td><td class="nt">${NH}</td></tr>`}).join("");
$("#cnt").textContent=rows.length+" 筆"}
["q","fl","st","cf"].forEach(i=>$("#"+i).oninput=render);
$("#tb").onclick=e=>{const tr=e.target.closest("tr");if(tr)openT(tr.dataset.id)};
$("#gq").oninput=()=>{const q=$("#gq").value.trim().toLowerCase();if(q.length<2){$("#sr").innerHTML="";return}const o=[];
Object.values(D.tenants).forEach(t=>`${t.tenantNo} ${t.name} ${t.phone}`.toLowerCase().includes(q)&&o.push(["專櫃",`${t.tenantNo||""} ${t.name}　${t.floor||""}`,t.id]));
Object.values(D.registers).forEach(r=>`${r.registerNo} ${r.ip}`.toLowerCase().includes(q)&&o.push(["機器",`${r.registerNo}　IP ${r.ip||"-"}　${r.model||""}　→ ${(D.tenants[r.tenantId]||{}).name||""}`,r.tenantId]));
Object.values(D.edc).forEach(e=>e.tid.includes(q)&&o.push(["EDC",`${e.tid}　${e.acquirer}${e.kind}${e.registerNo?"　→ "+e.registerNo:""}　→ ${(D.tenants[e.tenantId]||{}).name||""}`,e.tenantId]));
$("#sr").innerHTML=o.slice(0,100).map(x=>`<div class="res" data-id="${esc(x[2])}"><span class="t">${x[0]}</span> ${esc(x[1])}</div>`).join("")||"找不到符合的資料"};
$("#sr").onclick=e=>{const r=e.target.closest(".res");if(r&&D.tenants[r.dataset.id])openT(r.dataset.id)};
// ---------- write helpers
const ts=()=>firebase.firestore.FieldValue.serverTimestamp(),clean=o=>JSON.parse(JSON.stringify(o||null));
async function put(col,id,data){const by=$("#op").value;if(!by){alert("請先在右上角選擇操作人");return false}
const before=D[col][id]?clean(D[col][id]):null,doc={...data,updatedAt:ts(),updatedBy:by};if(!before)doc.createdAt=ts();
try{await db.collection(C[col]).doc(id).set(doc,{merge:true});await db.collection(C.log).add({at:ts(),by,col,id,act:before?"update":"create",before,after:data})}catch(e){alert("儲存失敗："+e.message);return false}
D[col][id]={...(D[col][id]||{}),...data,id};return true}
async function del(col,id){const by=$("#op").value;if(!by){alert("請先選擇操作人");return false}if(!confirm("確定刪除？"))return false;
try{await db.collection(C[col]).doc(id).delete();await db.collection(C.log).add({at:ts(),by,col,id,act:"delete",before:clean(D[col][id]),after:null})}catch(e){alert("刪除失敗："+e.message);return false}
delete D[col][id];return true}
function warn(col,d,id){const w=[];
if(col==="registers"){if(d.ip&&!/^\d{1,3}\.\d{1,3}$/.test(d.ip))w.push("IP 格式應為 數字.數字");
if(d.ip&&Object.values(D.registers).some(r=>r.id!==id&&r.ip===d.ip))w.push("IP "+d.ip+" 已被其他機器使用");
const p=PFX[(D.tenants[d.tenantId]||{}).floor];if(p&&d.model!=="mPOS"&&d.ip&&d.ip.split(".")[0]!==p)w.push(`IP 前綴與樓層規則不符（應為 ${p}.x）`)}
if(col==="edc"){if(!/^\d{8}$/.test(d.tid))w.push("TID 應為 8 碼數字");if(Object.values(D.edc).some(e=>e.id!==id&&e.tid===d.tid&&e.acquirer===d.acquirer))w.push("同收單行已有相同 TID")}
if(col==="tenants"){if(d.tenantNo&&!/^[A-Z]\d{4}$/.test(d.tenantNo))w.push("櫃號格式應為 1 英文字母＋4 位數字");if(d.tenantNo&&Object.values(D.tenants).some(t=>t.id!==id&&t.tenantNo===d.tenantNo))w.push("櫃號已存在")}
return w}
const val=tr=>{const o={};tr.querySelectorAll("[data-k]").forEach(i=>o[i.dataset.k]=i.value.trim()||null);return o};
// ---------- tenant detail
function openT(id){curT=id;const t=D.tenants[id];if(!t)return;const rs=regsOf(id),es=edcOf(id),ns=notesOf("tenant",id);
const f=(k,l,type)=>`<label>${l}<input data-k="${k}" type="${type||"text"}" value="${esc(t[k])}"></label>`;
const regRow=r=>`<tr data-c="registers" data-id="${esc(r.id)}"><td><input data-k="registerNo" value="${esc(r.registerNo)}" ${r.id?"readonly":""}>${(r.flags||[]).map(x=>`<span class="b">${x}</span>`).join("")}</td><td>${esc(posLoc(r.registerNo))}</td><td><select data-k="model">${opts(MOD,r.model||"")}</select></td><td><input data-k="ip" value="${esc(r.ip)}"></td><td><select data-k="status">${opts(RST,r.status||"使用中")}</select></td><td><input data-k="note" value="${esc(r.note)}"></td><td><button class="s sv">存</button> <button class="s d dl">刪</button></td></tr>`;
const edcRow=e=>`<tr data-c="edc" data-id="${esc(e.id)}"><td><input data-k="tid" value="${esc(e.tid)}">${(e.flags||[]).map(x=>`<span class="b">${x}</span>`).join("")}</td><td><select data-k="acquirer">${opts(["中信","聯信"],e.acquirer||"中信")}</select></td><td><select data-k="kind">${opts(["有線","無線"],e.kind||"有線")}</select></td><td><select data-k="registerNo">${opts([""].concat(rs.map(r=>r.registerNo)),e.registerNo||"")}</select></td><td><input data-k="purpose" value="${esc(e.purpose)}"></td><td><select data-k="status">${opts(["使用中","停用"],e.status||"使用中")}</select></td><td><button class="s sv">存</button> <button class="s d dl">刪</button></td></tr>`;
$("#md").innerHTML=`<div class="bar"><b style="font-size:16px">${esc(t.tenantNo||"")} ${esc(t.name)}</b><span class="sp"></span><button class="s" id="cl">關閉</button></div>
<div id="tf" data-c="tenants" data-id="${esc(id)}"><div class="g">${f("tenantNo","櫃號")}${f("name","櫃名")}<label>類型<select data-k="category">${opts(CAT,t.category||"")}</select></label>
<label>樓層<input data-k="floor" list="fls" value="${esc(t.floor)}"><datalist id="fls">${FLO.map(x=>`<option>${x}</option>`).join("")}</datalist></label>${f("phone","分機／電話")}${f("contractEnd","合約到期日","date")}
<label>狀態<select data-k="status">${opts(TST,t.status||"營業中")}</select></label>${f("openedAt","開幕日","date")}</div><p><button class="p sv">儲存專櫃資料</button></p></div>
<h3>收銀機（${rs.length}）</h3><table><thead><tr><th>機號</th><th>位置</th><th>機型</th><th>IP</th><th>狀態</th><th>備註</th><th></th></tr></thead><tbody id="rt">${rs.map(regRow).join("")}</tbody></table><p><button class="s" id="ar">＋新增收銀機</button></p>
<h3>EDC（${es.length}）</h3><table><thead><tr><th>TID</th><th>收單行</th><th>有線/無線</th><th>綁定機號</th><th>用途</th><th>狀態</th><th></th></tr></thead><tbody id="et">${es.map(edcRow).join("")}</tbody></table><p><button class="s" id="ae">＋新增 EDC</button></p>
<h3>備註（${ns.length}）</h3><div id="nl">${ns.map(n=>`<p data-id="${esc(n.id)}"><span class="t">${esc(n.category)}</span> ${esc(n.content)} <button class="s d dn">刪</button></p>`).join("")}</div>
<div class="bar" id="nf"><select data-k="category">${opts(NC,"")}</select><input data-k="content" size="60" placeholder="新增備註內容"><button class="s" id="an">新增備註</button></div>`;
$("#mod").style.display="block";$("#md").dataset.t=id;
$("#md").onclick=async e=>{const b=e.target,tr=b.closest("[data-c]"),T=$("#md").dataset.t;
if(b.id==="cl"){$("#mod").style.display="none";render();fillFl();return}
if(b.id==="ar"){$("#rt").insertAdjacentHTML("beforeend",regRow({id:""}));return}
if(b.id==="ae"){$("#et").insertAdjacentHTML("beforeend",edcRow({id:""}));return}
if(b.id==="an"){const o=val($("#nf"));if(!o.content)return;const nid="n"+Date.now();if(await put("notes",nid,{scope:"tenant",targetId:T,category:o.category,content:o.content,source:"手動"}))openT(T);return}
if(b.classList.contains("dn")){if(await del("notes",b.closest("p").dataset.id))openT(T);return}
if(b.classList.contains("dl")){if(!tr.dataset.id){tr.remove();return}if(await del(tr.dataset.c,tr.dataset.id)){if(tr.dataset.c==="registers")await syncFloor(T);openT(T)}return}
if(b.classList.contains("sv")){const c=tr.dataset.c;let id=tr.dataset.id,d=val(tr);
if(c==="registers"){if(!d.registerNo){alert("請輸入機號");return}if(!id){id=d.registerNo;if(D.registers[id]){alert("機號已存在");return}}d.tenantId=T;Object.assign(d,locFields(d))}
if(c==="edc"){if(!d.tid){alert("請輸入 TID");return}if(!id){id=d.acquirer+"-"+d.tid;if(D.edc[id])id+="#"+(Date.now()%1000)}d.tenantId=T}
if(c==="tenants"){if(!d.name){alert("請輸入櫃名");return}d.isVirtual=d.status==="虛擬"}
const w=warn(c,d,id);if(w.length&&!confirm(w.join("\n")+"\n\n仍要儲存？"))return;
if(await put(c,id,d)){if(c==="registers")await syncFloor(T);msg("已儲存");openT(T)}}}}
$("#nt").onclick=async()=>{const n=prompt("新專櫃的櫃名");if(!n)return;const no=(prompt("櫃號（虛擬專櫃可留空）")||"").trim(),id=no||"VIRT-"+Date.now();
if(D.tenants[id]){alert("此櫃號已存在");return}if(await put("tenants",id,{tenantNo:no,name:n.trim(),category:"",floor:"",phone:"",contractEnd:null,status:no?"籌備中（新開幕）":"虛擬",isVirtual:!no,openedAt:null}))openT(id)};
// ---------- import
$("#fi").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{seed=JSON.parse(await f.text())}catch(x){$("#log").textContent="不是有效的 JSON";return}
$("#log").textContent=Object.keys(seed).map(k=>`${k}：${seed[k].length} 筆`).join("\n");$("#go").disabled=false};
$("#go").onclick=async()=>{const by=$("#op").value;if(!by){alert("請先選擇操作人");return}if(!confirm("確定匯入？相同 ID 的資料會被覆蓋。"))return;$("#go").disabled=true;seedFix();
const map={tenants:"tenants",registers:"registers",edc:"edc",events:"events",notes:"notes"},lg=t=>{$("#log").textContent+="\n"+t};
try{for(const k of Object.keys(map)){const a=seed[k]||[];for(let i=0;i<a.length;i+=400){const b=db.batch();a.slice(i,i+400).forEach(x=>{const{id,...d}=x;b.set(db.collection(C[k]).doc(id),{...d,createdAt:ts(),updatedAt:ts(),updatedBy:"匯入："+by})});await b.commit();lg(`${k}：${Math.min(i+400,a.length)}/${a.length}`)}}
lg("完成，重新載入資料…");await boot();lg("已載入")}catch(e){lg("失敗："+e.message)}$("#go").disabled=false};
</script></body></html>
